notes: >-
  Enigma publishes NO first-party language SDK for the GraphQL API, the KYB REST API or the Screen
  API. Its own skills tell callers to hit the endpoints with plain `urllib` from Python
  ("NEVER use curl ... always use Python urllib"), which is a direct statement that no client library
  is expected. npm `enigma`, `enigma-api`, `enigma-sdk` and PyPI `enigma` all resolve to unrelated
  third-party packages and are NOT recorded here. What Enigma does ship is agent-side tooling: an npm
  stdio proxy for its remote MCP server, and a Claude Code plugin marketplace carrying three
  first-party Agent Skills.
