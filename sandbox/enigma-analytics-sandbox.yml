notes: >-
  Enigma publishes no test-mode credentials, no fixture identifiers and no separate sandbox host.
  What it offers instead is a free Console tier with a hosted GraphQL explorer, and — for sanctions
  screening only — a named public evaluation account. There are no test/live key prefixes: one
  x-api-key from the Console works against production data, and consumption is metered in credits,
  so every exploratory call is a billable production call once past the Free tier.
