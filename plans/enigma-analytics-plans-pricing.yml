notes: >-
  Enigma is unusual for a KYB/business-data provider in publishing real self-serve list prices rather
  than a contact-sales wall: Free, $20/mo Pro and $200/mo Max are all buyable without a sales
  conversation, with Enterprise as the negotiated tier. MCP access is gated to Pro and above.
