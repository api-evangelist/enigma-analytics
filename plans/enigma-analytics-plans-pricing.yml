currency: USD
billing_period: monthly
plan_count: 4
unit_of_consumption:
  name: credit
  price: 0.01
  currency: USD
  note: >-
    Enigma publishes "1 credit = 1c". Credits are consumed per ENTITY returned, at the tier of the
    most expensive attribute in the response — not per query. Attribute tiers are free, core, plus and
    premium; a core attribute costs 1 credit per entity, a plus attribute 3, a premium attribute 5.
    Nested entities compound: 1 Brand with 10 OperatingLocations carrying premium attributes is
    1 + (5 x 10) = 51 credits. Prepaid bundles of $100-$1,000 earn up to 25% bonus credits, valid for
    one year.
