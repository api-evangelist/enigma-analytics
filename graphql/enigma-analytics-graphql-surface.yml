shape_notes:
- >-
  Query.search returns the SearchUnion ([Brand, OperatingLocation, LegalEntity, Person,
  Address]) — a plain list of nodes, NOT a Relay connection. It takes no first/after.
- >-
  Every nested field (names, websites, addresses, operatingLocations, legalEntities,
  cardTransactions, industries, roles, tins, registeredEntities, persons, …) is a
  *Connection type traversed as (first: N) { edges { node { … } } }; max page size 100.
- >-
  Two distinct `conditions` types: `Conditions` on searchInput (filter, orderBy, limit,
  pageToken) and `ConnectionConditions` on nested connections.
