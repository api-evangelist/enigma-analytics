notes: >-
  Round 2 upgrade: previously derived from the GraphQL reference; now taken from Enigma's own
  provider-published llms.txt, which documents the entity model, the connection fields, the enum
  values and the traversal rules explicitly. graph-model-1. Relationships are exposed as Relay
  connections; every edge carries firstObservedDate, lastObservedDate, rank and datasetIds, so
  provenance and recency are first-class on every fact. rank 0 = primary/most recent.
core_entity_types: [BRAND, OPERATING_LOCATION, LEGAL_ENTITY]
union_members: [Brand, OperatingLocation, LegalEntity, Person, Address]
traversal_rules:
- Brand, OperatingLocation and LegalEntity are mutually interconnected — a Brand has many OperatingLocations and LegalEntities; an OperatingLocation belongs to Brand(s) and LegalEntity(ies).
- Card transactions exist on Brand and OperatingLocation but NOT directly on LegalEntity; reach them by traversing through brands or operatingLocations.
- Brand-level cardTransactions have no rawQuantity; OperatingLocation-level cardTransactions do.
- projectedQuantity is the statistical estimate of total market volume and is the field to use for business analysis; rawQuantity is the direct observation (Enigma observes roughly one third of U.S. card transactions).
entities:
- name: Brand
  description: >-
    A customer-facing business identity (e.g. "Starbucks"). Scalars id (ID!), internalId, enigmaId.
  relationships:
  - {to: BrandName, kind: has_many, via: names, node_fields: [name, rank, firstObservedDate, lastObservedDate]}
  - {to: Website, kind: has_many, via: websites, node_fields: [url, firstObservedDate, lastObservedDate]}
  - {to: OperatingLocation, kind: has_many, via: operatingLocations}
  - {to: LegalEntity, kind: has_many, via: legalEntities}
  - {to: Brand, kind: has_many, via: affiliatedBrands}
  - {to: CardTransaction, kind: has_many, via: cardTransactions, node_fields: [quantityType, period, projectedQuantity, periodStartDate, periodEndDate, firstObservedDate, lastObservedDate]}
  - {to: Industry, kind: has_many, via: industries, node_fields: [industryDesc, industryCode, industryType]}
  - {to: Activity, kind: has_many, via: activities, note: high-risk activity classifications (~130K brands)}
  - {to: RevenueQuality, kind: has_many, via: revenueQualities}
  - {to: LocationDescription, kind: has_many, via: locationDescriptions}
  - {to: IsMarketable, kind: has_many, via: isMarketables}
- name: OperatingLocation
