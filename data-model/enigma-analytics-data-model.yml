  - {to: PhoneNumber, kind: has_many, via: phoneNumbers}
  - {to: Brand, kind: has_many, via: brands}
  - {to: OperatingStatus, kind: has_many, via: operatingStatuses}
  - {to: CardTransaction, kind: has_many, via: cardTransactions, node_fields: [quantityType, period, rawQuantity, projectedQuantity, periodStartDate, periodEndDate]}
  - {to: LegalEntity, kind: has_many, via: legalEntities}
  - {to: Role, kind: has_many, via: roles}
  - {to: ReviewSummary, kind: has_many, via: reviewSummaries}
  - {to: Website, kind: has_many, via: websites}
  - {to: TechnologiesUsed, kind: has_many, via: technologiesUseds, note: POS systems, payment processors}
  - {to: Rank, kind: has_many, via: ranks, note: competitive revenue ranking}
  - {to: RevenueQuality, kind: has_many, via: revenueQualities}
  - {to: IsMarketable, kind: has_many, via: isMarketables}
  - {to: LocationType, kind: has_many, via: locationTypes}
- name: LegalEntity
