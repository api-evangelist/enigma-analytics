limit_count: 11
notes: >-
  Enigma publishes a dedicated rate-limits reference covering all three surfaces separately — the
  GraphQL API by plan, the KYB REST API by contract, and the MCP server PER TOOL. The per-tool MCP
  limits are the notable part: an agent's budget is scoped to the individual tool, on rolling 24-hour
  and 30-day windows, so exhausting `search_kyb` does not exhaust `search_business`.
response_signaling:
  status_on_exhaustion: 429
  status_text: Slow Down (GraphQL and MCP) / Too Many Requests (KYB)
  headers:
  - name: Retry-After
    units: seconds
    note: >-
      Documented as returned on 429. Enigma's own guidance: "Respect Retry-After: treat it as the
      minimum wait, not a suggestion."
  ratelimit_headers_published: false
  ratelimit_headers_note: >-
    No X-RateLimit-* or RFC 9331 RateLimit-* headers are documented, so a client cannot read its
    remaining budget before it is exhausted — only Retry-After after the fact. The docs tell callers
    to determine which limit fired (per-second, burst or daily) from their own accounting.
  retry_guidance: >-
    Exponential backoff starting at 1 second, doubling per retry, capped at 60 seconds; cap total
    retries per request; queue client-side or token-bucket below the plan RPS.
