quota_interaction:
  note: >-
    Rate limits are separate from credit consumption. A request inside the rate limit can still fail
    on billing — the GraphQL API returns 402 Payment Required for insufficient credits. See
    plans/enigma-analytics-plans-pricing.yml and errors/enigma-analytics-problem-types.yml.
