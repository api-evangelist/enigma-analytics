notes: >-
  Enigma publishes NO OpenAPI, so this crosswalk cannot bind tools to operationIds. It binds each MCP
  tool to the developer-facing surface that actually backs it — a GraphQL query shape on
  https://api.enigma.com/graphql, or one of the two REST endpoints Enigma documents
  (POST /v2/kyb/ and POST /evaluation/sanctions/screen). Both live schemas are auth-gated
  (GraphQL introspection 401s, MCP tools/list 401s), so every binding below is by NAME AND SEMANTICS
  from the provider's own documentation and first-party Agent Skills, and confidence is set
  accordingly. No binding here is verified against a machine-readable contract.
surfaces:
  openapi:
    present: false
    note: >-
      Probed /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs and
      /redoc on api.enigma.com, documentation.enigma.com, www.enigma.com and console.enigma.com on
      2026-08-14. api.enigma.com serves a 21,489-byte Docusaurus HTML shell at every path (soft-404);
      api.enigma.com/v1/openapi.json returns 403 {"message":"Missing Authentication Token"} — the AWS
      API Gateway default, i.e. no such route. No OpenAPI is published for any of the three REST/GraphQL
      surfaces.
  graphql:
    endpoint: https://api.enigma.com/graphql
    introspection: gated
    introspection_status: 401
    introspection_body: '{"error_message":"Missing or invalid API key","error_code":"UNAUTHORIZED","retryable":false}'
    docs: https://documentation.enigma.com/reference/graphql_api/
    note: >-
      Query root exposes `search(searchInput: SearchInput!)` returning a union of
      Brand | OperatingLocation | LegalEntity | Person | Address, plus `aggregate` and
      `backgroundTask`. Full field inventory in data-model/enigma-analytics-data-model.yml.
  rest:
  - name: KYB REST API
    endpoint: POST https://api.enigma.com/v2/kyb/
    spec: none
    docs: https://documentation.enigma.com/kyb
  - name: Screen API
    endpoint: POST https://api.enigma.com/evaluation/sanctions/screen
    spec: none
    docs: https://documentation.enigma.com/guides/ai-mcp/screening-tools
    note: >-
      Endpoint recorded from Enigma's own published Agent Skill (enigma-screen SKILL.md in
      github.com/enigma-io/enigma-claude-plugins); it also requires an `Account-Name` header.
  mcp:
    url: https://mcp.enigma.com/mcp
    tools_list: gated
    tools_list_status: 401
    auth: oauth
