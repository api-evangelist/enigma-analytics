name: Enigma Analytics
description: >-
  Enigma Analytics (Enigma Technologies) operates a knowledge graph of every U.S. business —
  100M+ business registrations and 2B+ relationships spanning brands, legal entities, operating
  locations, addresses, and the people behind them, enriched with 750M+ anonymized cards and 30B+
  annual card transactions. Enigma exposes this business identity infrastructure through three
  developer surfaces — a Relay-style GraphQL API, a KYB REST API, and a sanctions Screen API —
  plus a hosted Console and an OAuth 2.1 remote MCP server, powering Know Your Business (KYB)
  onboarding, sanctions and watchlist screening, negative-news and government-archive checks, TIN
  and SSN verification, card-transaction analytics, and payment underwriting and go-to-market
  signals for banks, fintechs, and payments platforms. Pricing is published and self-serve, metered
  in credits at one cent each.
