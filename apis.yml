name: Enigma Analytics
description: >-
  Enigma Analytics (Enigma Technologies) operates a knowledge graph of every U.S. business —
  100M+ business registrations and 2B+ relationships spanning brands, legal entities, operating
  locations, addresses, and the people behind them. Enigma exposes this business identity
  infrastructure through a Relay-style GraphQL API, a hosted Console, and a remote MCP server,
  powering Know Your Business (KYB) onboarding, sanctions and watchlist screening, negative-news
  and government-archive checks, TIN verification, card-transaction analytics, and payment
  underwriting and go-to-market signals for banks, fintechs, and payments platforms.
