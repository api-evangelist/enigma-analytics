apis:
- name: Enigma GraphQL API
  description: >-
    Enigma's primary programmatic surface: a Relay-style GraphQL API over the business knowledge
    graph. Query Brand, LegalEntity, OperatingLocation, Address, Person, and Industry entities via
    connection-based (cursor) pagination, a full filter algebra (EQ/IN/LIKE/AND/OR/HAS and
    arithmetic operators), math functions, an aggregate query, and async segmentation exports polled
    through backgroundTask. Authenticated with an x-api-key header and metered in credits per entity
    returned.
  humanURL: https://documentation.enigma.com/reference/graphql_api/
  baseURL: https://api.enigma.com/graphql
  tags:
