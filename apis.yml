- name: Enigma KYB REST API
  description: >-
    REST endpoint for Know Your Business verification. POST a business name, address, website, TIN
    and/or person and receive identity matching and compliance validation. The `identify` package
    returns basic matching and enrichment; the default `verify` package adds jurisdiction type,
    registration status/sub-status/detail, person verification and domestic registration
    verification. Add-on tasks via the attrs query parameter cover TIN (EIN) verification, OFAC
    watchlist screening and SSN verification. Authenticated with an x-api-key header.
  humanURL: https://documentation.enigma.com/kyb
  baseURL: https://api.enigma.com/v2/kyb/
  tags:
  - KYB
  - Identity Verification
  - Compliance
  properties:
  - type: Documentation
    url: https://documentation.enigma.com/kyb
  - type: GettingStarted
    url: https://documentation.enigma.com/docs/kyb-api-quickstart
  - type: APIReference
    url: https://documentation.enigma.com/kyb/response
  - type: RateLimits
    url: rate-limits/enigma-analytics-rate-limits.yml
  - type: AgentSkill
    url: skills/enigma-analytics-enigma-kyb-published.md
- name: Enigma Screen API
  description: >-
    REST endpoint for screening persons and organizations against sanctions, PEP and watchlist
    databases. Accepts a batch of ENTITY searches carrying person_name and/or org_name descriptions
    and returns match confidence, potential matches and source list detail, with a decisioning
    workflow (find/update decision) layered on top. Authenticated with an x-api-key header plus an
    Account-Name header.
  humanURL: https://documentation.enigma.com/guides/ai-mcp/screening-tools
  baseURL: https://api.enigma.com/evaluation/sanctions/screen
  tags:
  - Sanctions Screening
  - Compliance
  - Identity Verification
  properties:
  - type: Documentation
    url: https://documentation.enigma.com/guides/ai-mcp/screening-tools
  - type: AgentSkill
    url: skills/enigma-analytics-enigma-screen-published.md
  - type: Sandbox
    url: sandbox/enigma-analytics-sandbox.yml
- name: Enigma MCP Server
  description: >-
    Remote Model Context Protocol server for U.S. business intelligence — entity resolution, KYB
    verification, sanctions and negative-news screening, card-transaction analytics and
    public-records search — exposed as 16 documented tools over streamable HTTP. Authorized with the
    MCP OAuth 2.1 profile (dynamic client registration, PKCE S256) against oauth.enigma.com, or with
    a bearer token tied to an Enigma API key. Rate limited per tool on rolling 24-hour and 30-day
    windows. Declared in a server card at www.enigma.com/.well-known/mcp/server-card.json.
  humanURL: https://documentation.enigma.com/guides/ai-mcp
  baseURL: https://mcp.enigma.com/mcp
  tags:
  - MCP
  - Business Data
  - Sanctions Screening
